name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-pyinstaller:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onedir --noupx --clean --name docx --version-file version_info.txt main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: docx-pyinstaller-windows
          path: dist/docx
